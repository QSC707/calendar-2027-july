<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电费记录表 · 用电统计</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
  :root {
    --bg: #f1f5f9; --card: #ffffff; --line: #e2e8f0; --line2: #cbd5e1;
    --ink: #0f172a; --sub: #64748b; --dim: #94a3b8;
    --blue: #2563eb; --blue2: #3b82f6; --purple: #7c3aed;
    --amber: #f59e0b; --green: #10b981; --red: #ef4444; --cyan: #06b6d4;
  }
  html, body { background: var(--bg); color: var(--ink); font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; min-height: 100vh; }
  body { background: radial-gradient(ellipse 70% 40% at 50% -5%, rgba(37,99,235,0.08), transparent), var(--bg); }

  header { position: sticky; top: 0; z-index: 100; background: rgba(248,250,252,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--line); }
  .h-in { max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 11px; background: linear-gradient(135deg, var(--blue), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 19px; color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
  .brand h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .brand .sub { font-size: 12px; color: var(--sub); }
  .total { text-align: right; }
  .total .lbl { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: 0.05em; }
  .total .val { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--blue); }

  .tabs { max-width: 1100px; margin: 0 auto; padding: 0 24px; display: flex; gap: 4px; }
  .tab { background: none; border: none; color: var(--sub); font-size: 14px; font-weight: 600; padding: 12px 18px; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; font-family: inherit; }
  .tab:hover { color: var(--ink); }
  .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

  main { max-width: 1100px; margin: 0 auto; padding: 24px; }
  .page { display: none; animation: fade .3s ease; }
  .page.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; position: relative; overflow: hidden; transition: transform .2s, box-shadow .2s; }
  .stat:hover { transform: translateY(-2px); box-shadow: 0 8px 24px -8px rgba(0,0,0,0.12); }
  .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--c, var(--blue)); border-radius: 16px 16px 0 0; }
  .stat .ico { font-size: 20px; margin-bottom: 8px; }
  .stat .lbl { font-size: 12px; color: var(--sub); font-weight: 500; }
  .stat .val { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-top: 4px; color: var(--c, var(--ink)); }
  .stat .delta { font-size: 11px; margin-top: 6px; color: var(--dim); font-weight: 500; }

  .grid2 { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; margin-bottom: 24px; }
  .grid2b { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; }
  .card h3 { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .card h3 .more { font-size: 12px; color: var(--sub); font-weight: 500; }
  canvas { display: block; width: 100%; }

  .records { display: flex; flex-direction: column; gap: 8px; max-height: 380px; overflow-y: auto; }
  .records::-webkit-scrollbar { width: 6px; }
  .records::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 3px; }
  .rec { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); transition: all .15s; }
  .rec:hover { border-color: var(--line2); box-shadow: 0 2px 8px -2px rgba(0,0,0,0.08); }
  .rec .ym { font-size: 14px; font-weight: 700; min-width: 80px; color: var(--blue); }
  .rec .info { flex: 1; display: flex; gap: 16px; font-size: 13px; color: var(--sub); }
  .rec .info b { color: var(--ink); font-weight: 600; }
  .rec .amt { font-size: 16px; font-weight: 700; color: var(--amber); font-variant-numeric: tabular-nums; }
  .rec .del { opacity: 0; background: none; border: none; color: var(--dim); cursor: pointer; font-size: 16px; padding: 4px; transition: all .15s; }
  .rec:hover .del { opacity: 1; }
  .rec .del:hover { color: var(--red); }

  .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .form-row > * { flex: 1; min-width: 100px; }
  input, select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; color: var(--ink); font-size: 14px; font-family: inherit; width: 100%; transition: border .15s; }
  input:focus, select:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
  label { font-size: 12px; color: var(--sub); font-weight: 500; display: block; margin-bottom: 5px; }
  .btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; }
  .btn:hover { background: var(--blue2); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37,99,235,0.3); }
  .btn.full { width: 100%; }

  .year-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; transition: transform .2s, box-shadow .2s; }
  .year-card:hover { transform: translateY(-2px); box-shadow: 0 6px 20px -6px rgba(0,0,0,0.1); }
  .year-card .yh { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .year-card .yh .yn { font-size: 18px; font-weight: 700; }
  .year-card .yh .yt { font-size: 20px; font-weight: 700; color: var(--amber); }
  .year-card .ymeta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .year-card .ymeta .m { text-align: center; }
  .year-card .ymeta .m .v { font-size: 16px; font-weight: 700; }
  .year-card .ymeta .m .l { font-size: 11px; color: var(--sub); }
  .year-card .qbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .year-card .qbar .q { height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; transition: transform .15s; }
  .year-card .qbar .q:hover { transform: scaleY(1.1); }

  .quarter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .q-card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 16px; text-align: center; }
  .q-card .qn { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  .q-card .qv { font-size: 22px; font-weight: 700; color: var(--c, var(--blue)); }
  .q-card .qd { font-size: 12px; color: var(--dim); margin-top: 4px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--dim); font-size: 14px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 10px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 999; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 768px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .grid2, .grid2b { grid-template-columns: 1fr; }
    .quarter-grid { grid-template-columns: 1fr; }
    .h-in { padding: 12px 16px; } main { padding: 16px; } .tabs { padding: 0 16px; }
    .rec .info { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="h-in">
    <div class="brand">
      <div class="logo">⚡</div>
      <div><h1>电费记录表</h1><div class="sub">用电统计 · 年度季度分析</div></div>
    </div>
    <div class="total"><div class="lbl">累计电费</div><div class="val" id="totalAmt">¥0</div></div>
  </div>
  <div class="tabs">
    <button class="tab active" data-page="overview">总览</button>
    <button class="tab" data-page="records">记录</button>
    <button class="tab" data-page="yearly">年度</button>
    <button class="tab" data-page="quarterly">季度</button>
  </div>
</header>

<main>
  <div class="page active" id="overview">
    <div class="stats" id="ovStats"></div>
    <div class="grid2">
      <div class="card"><h3>月度电费趋势 <span class="more">近12月</span></h3><canvas id="trendChart" height="220"></canvas></div>
      <div class="card"><h3>用电量分布 <span class="more">按季</span></h3><canvas id="pieChart" height="220"></canvas></div>
    </div>
    <div class="card"><h3>最近记录</h3><div class="records" id="recentRecords"></div></div>
  </div>

  <div class="page" id="records">
    <div class="card" style="margin-bottom:16px">
      <h3>添加电费记录</h3>
      <div class="form-row">
        <div><label>年份</label><select id="fYear"></select></div>
        <div><label>月份</label><select id="fMonth"></select></div>
        <div><label>用电量(度)</label><input type="number" id="fKwh" placeholder="如 180" min="0" step="0.1"></div>
        <div><label>金额(元)</label><input type="number" id="fAmount" placeholder="如 108.5" min="0" step="0.01"></div>
      </div>
      <div class="form-row">
        <div style="flex:2"><label>备注</label><input type="text" id="fNote" placeholder="可选"></div>
        <div style="flex:0 0 auto;align-self:flex-end"><button class="btn full" id="addRec">添加</button></div>
      </div>
    </div>
    <div class="card">
      <h3>所有记录 <span class="more" id="recCount">0 条</span></h3>
      <div class="form-row" style="margin-bottom:12px">
        <div><label>筛选年份</label><select id="filterYear"><option value="">全部</option></select></div>
      </div>
      <div class="records" id="allRecords"></div>
    </div>
  </div>

  <div class="page" id="yearly">
    <div class="card" style="margin-bottom:16px"><h3>年度电费对比</h3><canvas id="yearChart" height="200"></canvas></div>
    <div id="yearCards"></div>
  </div>

  <div class="page" id="quarterly">
    <div class="card" style="margin-bottom:16px">
      <h3>季度统计 <span class="more" id="qYearLabel"></span></h3>
      <div class="form-row" style="margin-bottom:16px">
        <div><label>选择年份</label><select id="qYearSel"></select></div>
      </div>
      <div class="quarter-grid" id="quarterGrid"></div>
    </div>
    <div class="card"><h3>季度对比图</h3><canvas id="quarterChart" height="220"></canvas></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const S = 'electricity_v1';
const MONTHS = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
const QCOLORS = ['#10b981', '#f59e0b', '#ef4444', '#06b6d4'];
const QNAMES = ['Q1 春季', 'Q2 夏季', 'Q3 秋季', 'Q4 冬季'];

let data = { records: [] };
const uid = () => Math.random().toString(36).slice(2, 9);
const fmt = n => '¥' + Math.round(n * 100) / 100;
const fmtK = n => n >= 10000 ? (n / 10000).toFixed(1) + '万' : Math.round(n).toString();
const save = () => localStorage.setItem(S, JSON.stringify(data));
const load = () => { try { const d = JSON.parse(localStorage.getItem(S)); if (d && d.records) data = d; } catch(e){} };

let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800); }

function seed() {
  if (data.records.length) return;
  const seasonal = [120, 100, 95, 110, 150, 220, 280, 260, 180, 130, 110, 140];
  for (let y = 2023; y <= 2026; y++) {
    for (let m = 0; m < 12; m++) {
      if (y === 2026 && m > 8) continue;
      const base = seasonal[m];
      const kwh = Math.round(base * (1 + (y - 2023) * 0.03) + (Math.random() - 0.5) * 20);
      const price = 0.58 + (y - 2023) * 0.02;
      const amount = Math.round(kwh * price * 100) / 100;
      data.records.push({ id: uid(), year: y, month: m + 1, kwh, amount, note: '' });
    }
  }
  save();
}

function quarterOf(m) { return Math.floor((m - 1) / 3); }
function yearStats(y) {
  const rs = data.records.filter(r => r.year === y);
  const amt = rs.reduce((s, r) => s + r.amount, 0);
  const kwh = rs.reduce((s, r) => s + r.kwh, 0);
  const qs = [0, 0, 0, 0];
  rs.forEach(r => { qs[quarterOf(r.month)] += r.amount; });
  return { amt, kwh, count: rs.length, qs, avg: rs.length ? amt / rs.length : 0 };
}
function allStats() {
  const amt = data.records.reduce((s, r) => s + r.amount, 0);
  const kwh = data.records.reduce((s, r) => s + r.kwh, 0);
  const years = [...new Set(data.records.map(r => r.year))].sort();
  return { amt, kwh, count: data.records.length, years, avg: data.records.length ? amt / data.records.length : 0 };
}

function renderOverview() {
  const all = allStats();
  const cy = new Date().getFullYear();
  const ys = yearStats(cy);
  const lastY = yearStats(cy - 1);
  document.getElementById('totalAmt').textContent = fmt(all.amt);
  const yDelta = lastY.amt ? ((ys.amt - lastY.amt) / lastY.amt * 100) : 0;
  document.getElementById('ovStats').innerHTML = `
    <div class="stat" style="--c:var(--amber)"><div class="ico">💡</div><div class="lbl">累计电费</div><div class="val">${fmt(all.amt)}</div><div class="delta">${all.count} 个月记录</div></div>
    <div class="stat" style="--c:var(--blue)"><div class="ico">⚡</div><div class="lbl">累计用电</div><div class="val">${fmtK(all.kwh)} 度</div><div class="delta">均价 ¥${(all.kwh ? all.amt / all.kwh : 0).toFixed(2)}/度</div></div>
    <div class="stat" style="--c:var(--purple)"><div class="ico">📅</div><div class="lbl">${cy}年电费</div><div class="val">${fmt(ys.amt)}</div><div class="delta" style="color:${yDelta>=0?'var(--red)':'var(--green)'}">${yDelta>=0?'↑':'↓'} ${Math.abs(yDelta).toFixed(1)}% 同比</div></div>
    <div class="stat" style="--c:var(--green)"><div class="ico">📊</div><div class="lbl">月均电费</div><div class="val">${fmt(all.avg)}</div><div class="delta">最高 ${fmt(Math.max(...data.records.map(r=>r.amount),0))}</div></div>
  `;
  drawTrend(); drawPie(); renderRecent();
}

function renderRecent() {
  const recs = [...data.records].sort((a, b) => (b.year - a.year) || (b.month - a.month)).slice(0, 8);
  const el = document.getElementById('recentRecords');
  el.innerHTML = recs.length ? recs.map(r => recHTML(r)).join('') : '<div class="empty">暂无记录</div>';
  bindDels(el);
}

function recHTML(r) {
  return `<div class="rec">
    <div class="ym">${r.year}.${String(r.month).padStart(2,'0')}</div>
    <div class="info"><span><b>${r.kwh}</b> 度</span><span>单价 <b>¥${(r.amount / r.kwh).toFixed(2)}</b></span>${r.note ? `<span>${r.note}</span>` : ''}</div>
    <div class="amt">${fmt(r.amount)}</div>
    <button class="del" data-id="${r.id}">✕</button>
  </div>`;
}

function bindDels(el) {
  el.querySelectorAll('.del').forEach(b => b.addEventListener('click', () => {
    data.records = data.records.filter(r => r.id !== b.dataset.id);
    save(); renderAll(); toast('已删除');
  }));
}

function drawTrend() {
  const cv = document.getElementById('trendChart');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 220;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const recs = [...data.records].sort((a, b) => (a.year - b.year) || (a.month - b.month)).slice(-12);
  if (!recs.length) { ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('暂无数据', w / 2, h / 2); return; }
  const maxV = Math.max(...recs.map(r => r.amount)) * 1.15;
  const pad = { l: 50, r: 16, t: 16, b: 28 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV * (1 - i / 4)), pad.l - 8, y + 4);
  }
  const bw = cw / recs.length * 0.6;
  recs.forEach((r, i) => {
    const x = pad.l + cw * (i + 0.5) / recs.length - bw / 2;
    const bh = ch * r.amount / maxV;
    const y = pad.t + ch - bh;
    const grad = ctx.createLinearGradient(0, y, 0, y + bh);
    grad.addColorStop(0, '#3b82f6'); grad.addColorStop(1, '#2563eb');
    ctx.fillStyle = grad; ctx.beginPath();
    ctx.roundRect(x, y, bw, bh, 4); ctx.fill();
    ctx.fillStyle = '#64748b'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(r.month + '月', x + bw / 2, h - 8);
  });
}

function drawPie() {
  const cv = document.getElementById('pieChart');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 220;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const all = allStats();
  const qs = [0, 0, 0, 0];
  data.records.forEach(r => { qs[quarterOf(r.month)] += r.kwh; });
  const total = qs.reduce((s, v) => s + v, 0);
  if (!total) { ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('暂无数据', w / 2, h / 2); return; }
  const cx = w / 2 - 45, cy = h / 2, R = Math.min(72, h / 2 - 20), r = R * 0.58;
  let ang = -Math.PI / 2;
  qs.forEach((v, i) => {
    if (!v) return;
    const a = v / total * Math.PI * 2;
    ctx.beginPath(); ctx.arc(cx, cy, R, ang, ang + a); ctx.arc(cx, cy, r, ang + a, ang, true); ctx.closePath();
    ctx.fillStyle = QCOLORS[i]; ctx.fill();
    ang += a;
  });
  ctx.fillStyle = '#0f172a'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(fmtK(total) + '度', cx, cy + 2);
  ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif';
  ctx.fillText('总用电', cx, cy + 20);
  const lx = cx + R + 18;
  QNAMES.forEach((n, i) => {
    const ly = cy - 48 + i * 18;
    ctx.fillStyle = QCOLORS[i]; ctx.fillRect(lx, ly, 8, 8);
    ctx.fillStyle = '#475569'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(`${n} ${Math.round(qs[i] / total * 100)}%`, lx + 12, ly + 7);
  });
}

function renderRecords() {
  const years = [...new Set(data.records.map(r => r.year))].sort();
  const fy = document.getElementById('fYear');
  const cy = new Date().getFullYear();
  fy.innerHTML = '';
  for (let y = Math.min(cy, ...years, 2023); y <= Math.max(cy, ...years) + 1; y++) fy.innerHTML += `<option value="${y}" ${y === cy ? 'selected' : ''}>${y}年</option>`;
  document.getElementById('fMonth').innerHTML = MONTHS.map((m, i) => `<option value="${i + 1}">${m}</option>`).join('');
  const fY = document.getElementById('filterYear');
  fY.innerHTML = '<option value="">全部年份</option>' + years.map(y => `<option value="${y}">${y}年</option>`).join('');
  renderAllRecords();
}

function renderAllRecords() {
  const fy = document.getElementById('filterYear').value;
  let recs = [...data.records].sort((a, b) => (b.year - a.year) || (b.month - a.month));
  if (fy) recs = recs.filter(r => r.year === parseInt(fy));
  document.getElementById('recCount').textContent = recs.length + ' 条';
  const el = document.getElementById('allRecords');
  el.innerHTML = recs.length ? recs.map(r => recHTML(r)).join('') : '<div class="empty">暂无记录</div>';
  bindDels(el);
}

function renderYearly() {
  const all = allStats();
  const yc = document.getElementById('yearCards');
  const years = all.years.slice().reverse();
  yc.innerHTML = years.length ? years.map(y => {
    const s = yearStats(y);
    const maxQ = Math.max(...s.qs, 1);
    return `<div class="year-card">
      <div class="yh"><span class="yn">${y}年</span><span class="yt">${fmt(s.amt)}</span></div>
      <div class="ymeta">
        <div class="m"><div class="v">${fmtK(s.kwh)}度</div><div class="l">总用电</div></div>
        <div class="m"><div class="v">${fmt(s.avg)}</div><div class="l">月均电费</div></div>
        <div class="m"><div class="v">¥${(s.kwh ? s.amt / s.kwh : 0).toFixed(2)}</div><div class="l">均价/度</div></div>
      </div>
      <div class="qbar">${s.qs.map((q, i) => `<div class="q" style="background:${QCOLORS[i]};opacity:${0.4 + 0.6 * q / maxQ}">${q > 0 ? fmt(q) : ''}</div>`).join('')}</div>
    </div>`;
  }).join('') : '<div class="empty">暂无数据</div>';
  drawYearChart();
}

function drawYearChart() {
  const cv = document.getElementById('yearChart');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 200;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const all = allStats();
  if (!all.years.length) { ctx.fillStyle = '#94a3b8'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('暂无数据', w / 2, h / 2); return; }
  const vals = all.years.map(y => yearStats(y).amt);
  const maxV = Math.max(...vals) * 1.2;
  const pad = { l: 60, r: 16, t: 16, b: 28 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.t + ch * i / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxV * (1 - i / 4)), pad.l - 8, y + 4);
  }
  const bw = cw / all.years.length * 0.5;
  all.years.forEach((y, i) => {
    const x = pad.l + cw * (i + 0.5) / all.years.length - bw / 2;
    const bh = ch * vals[i] / maxV;
    const yy = pad.t + ch - bh;
    const grad = ctx.createLinearGradient(0, yy, 0, yy + bh);
    grad.addColorStop(0, '#7c3aed'); grad.addColorStop(1, '#2563eb');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, yy, bw, bh, 5); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(fmt(vals[i]), x + bw / 2, yy - 6);
    ctx.fillStyle = '#64748b'; ctx.font = '11px sans-serif';
    ctx.fillText(y + '年', x + bw / 2, h - 8);
  });
}

function renderQuarterly() {
  const all = allStats();
  const qs = document.getElementById('qYearSel');
  const cy = new Date().getFullYear();
  qs.innerHTML = all.years.map(y => `<option value="${y}" ${y === cy ? 'selected' : ''}>${y}年</option>`).join('');
  const y = parseInt(qs.value) || all.years[all.years.length - 1] || cy;
  document.getElementById('qYearLabel').textContent = y + '年';
  const s = yearStats(y);
  const qg = document.getElementById('quarterGrid');
  qg.innerHTML = QNAMES.map((n, i) => {
    const qAmt = s.qs[i];
    const qRecs = data.records.filter(r => r.year === y && quarterOf(r.month) === i);
    const qKwh = qRecs.reduce((s2, r) => s2 + r.kwh, 0);
    return `<div class="q-card" style="--c:${QCOLORS[i]}"><div class="qn">${n} · ${i * 3 + 1}-${i * 3 + 3}月</div><div class="qv">${fmt(qAmt)}</div><div class="qd">${fmtK(qKwh)} 度 · ${qRecs.length} 月</div></div>`;
  }).join('');
  drawQuarterChart(y);
}

function drawQuarterChart(y) {
  const cv = document.getElementById('quarterChart');
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = 220;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const s = yearStats(y);
  const maxQ = Math.max(...s.qs, 1);
  const pad = { l: 50, r: 16, t: 30, b: 36 };
  const cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
  const bw = cw / 4 * 0.55;
  QNAMES.forEach((n, i) => {
    const x = pad.l + cw * (i + 0.5) / 4 - bw / 2;
    const bh = ch * s.qs[i] / maxQ;
    const yy = pad.t + ch - bh;
    const grad = ctx.createLinearGradient(0, yy, 0, yy + bh);
    grad.addColorStop(0, QCOLORS[i]); grad.addColorStop(1, QCOLORS[i] + '88');
    ctx.fillStyle = grad; ctx.beginPath(); ctx.roundRect(x, yy, bw, bh, 6); ctx.fill();
    ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px sans-serif'; ctx.textAlign = 'center';
    if (s.qs[i] > 0) ctx.fillText(fmt(s.qs[i]), x + bw / 2, yy - 6);
    ctx.fillStyle = '#64748b'; ctx.font = '12px sans-serif';
    ctx.fillText(n, x + bw / 2, h - 8);
    const months = `${i*3+1}-${i*3+3}月`;
    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif';
    ctx.fillText(months, x + bw / 2, h - 22);
  });
}

document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.page).classList.add('active');
  renderAll();
}));

document.getElementById('addRec').addEventListener('click', () => {
  const y = parseInt(document.getElementById('fYear').value);
  const m = parseInt(document.getElementById('fMonth').value);
  const kwh = parseFloat(document.getElementById('fKwh').value);
  const amt = parseFloat(document.getElementById('fAmount').value);
  const note = document.getElementById('fNote').value;
  if (!kwh || kwh <= 0) return toast('请输入用电量');
  if (!amt || amt <= 0) return toast('请输入金额');
  if (data.records.some(r => r.year === y && r.month === m)) return toast(`${y}年${m}月已有记录`);
  data.records.push({ id: uid(), year: y, month: m, kwh, amount: amt, note });
  document.getElementById('fKwh').value = ''; document.getElementById('fAmount').value = ''; document.getElementById('fNote').value = '';
  save(); renderAll(); toast('记录已添加');
});

document.getElementById('filterYear').addEventListener('change', renderAllRecords);
document.getElementById('qYearSel').addEventListener('change', () => renderQuarterly());

function renderAll() {
  renderOverview();
  const a = document.querySelector('.tab.active').dataset.page;
  if (a === 'records') renderRecords();
  if (a === 'yearly') renderYearly();
  if (a === 'quarterly') renderQuarterly();
}

load(); seed(); renderAll();
window.addEventListener('resize', renderAll);
</script>
