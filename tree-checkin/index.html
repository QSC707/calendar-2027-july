<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>种树打卡 · Tree Check-in</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A0F0A; --bg2:#0D150D;
    --card:rgba(255,255,255,0.035); --card2:rgba(255,255,255,0.06);
    --border:rgba(74,222,128,0.1); --border2:rgba(74,222,128,0.18);
    --text:#E8F5E8; --dim:#6B806B; --dim2:#4A5A4A;
    --green:#22C55E; --green2:#16A34A; --green3:#4ADE80; --green4:#86EFAC;
    --earth:#5D4037; --earth2:#3E2723;
    --gold:#FBBF24; --gold2:#F59E0B;
    --pink:#F472B6; --red:#EF4444;
  }
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI','SF Pro Display',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow-x:hidden; letter-spacing:-0.01em;
  }
  body::before,body::after{
    content:''; position:fixed; border-radius:50%; filter:blur(120px); pointer-events:none; z-index:0;
  }
  body::before{width:600px;height:600px;background:rgba(34,197,94,.06);top:-200px;left:-200px}
  body::after{width:500px;height:500px;background:rgba(251,191,36,.04);bottom:-150px;right:-150px}

  .ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .spore{
    position:absolute; width:3px; height:3px; border-radius:50%;
    background:rgba(134,239,172,.4); box-shadow:0 0 6px rgba(134,239,172,.3);
    animation:drift linear infinite;
  }
  @keyframes drift{
    0%{transform:translateY(100vh) translateX(0); opacity:0}
    10%{opacity:.6} 90%{opacity:.6}
    100%{transform:translateY(-10vh) translateX(40px); opacity:0}
  }

  .app{position:relative;z-index:1;width:100%;max-width:460px;padding:20px 16px}

  .header{text-align:center;margin-bottom:18px}
  .header h1{
    font-size:1.5rem;font-weight:800;letter-spacing:-0.04em;
    background:linear-gradient(135deg,var(--green4),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .header p{font-size:.78rem;color:var(--dim);margin-top:4px;letter-spacing:.02em}

  .tree-card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--border); border-radius:28px; padding:20px;
    backdrop-filter:blur(28px) saturate(1.2); -webkit-backdrop-filter:blur(28px) saturate(1.2);
    box-shadow:0 8px 40px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06),0 0 60px rgba(34,197,94,.04);
    margin-bottom:14px; position:relative; overflow:hidden;
  }
  .tree-card::before{
    content:''; position:absolute; top:0; left:-100%; width:50%; height:100%;
    background:linear-gradient(105deg,transparent,rgba(134,239,172,.04),transparent);
    animation:shimmer 8s infinite;
  }
  @keyframes shimmer{0%{left:-100%}100%{left:250%}}

  .tree-stage-bar{
    display:flex; justify-content:center; gap:4px; margin-bottom:10px;
  }
  .stage-pip{
    width:24px; height:3px; border-radius:2px;
    background:rgba(255,255,255,.06); transition:all .4s;
  }
  .stage-pip.active{
    background:linear-gradient(90deg,var(--green),var(--green3));
    box-shadow:0 0 8px rgba(34,197,94,.5);
  }
  .stage-pip.current{
    background:linear-gradient(90deg,var(--gold),var(--gold2));
    box-shadow:0 0 10px rgba(251,191,36,.5);
  }

  .tree-wrap{position:relative; width:100%; height:260px}
  .tree-svg{width:100%; height:100%; display:block}
  .tree-svg .sway{transform-origin:center bottom; animation:sway 4s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
  .tree-svg g.foliage{animation:grow .8s cubic-bezier(.34,1.56,.64,1); transform-origin:center bottom}
  @keyframes grow{0%{transform:scale(.7) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}

  .stage-info{text-align:center; margin:10px 0 14px}
  .stage-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 14px; border-radius:20px; font-size:.72rem; font-weight:600;
    background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(251,191,36,.08));
    border:1px solid rgba(74,222,128,.2); color:var(--green3);
    margin-bottom:8px;
  }
  .stage-dot{width:6px;height:6px;border-radius:50%;background:var(--green3);box-shadow:0 0 6px var(--green3);animation:pulse 2.5s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.4)}}

  .stage-name{font-size:1.15rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:2px}
  .stage-hint{font-size:.73rem;color:var(--dim)}

  .progress-wrap{margin-top:10px; position:relative}
  .progress-bar{height:5px;background:rgba(255,255,255,.05);border-radius:3px;overflow:hidden;position:relative}
  .progress-fill{
    height:100%;border-radius:3px;
    background:linear-gradient(90deg,var(--green2),var(--green),var(--green3));
    transition:width .8s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 10px rgba(34,197,94,.4);
    position:relative;
  }
  .progress-fill::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
    animation:progressShine 2s infinite;
  }
  @keyframes progressShine{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  .checkin-btn{
    width:100%; padding:15px; border:none; border-radius:18px; cursor:pointer;
    font-size:1rem; font-weight:700; letter-spacing:-0.01em;
    background:linear-gradient(135deg,var(--green2),var(--green));
    color:#fff; transition:all .25s cubic-bezier(.4,0,.2,1);
    position:relative; overflow:hidden;
    box-shadow:0 4px 20px rgba(34,197,94,.25),inset 0 1px 0 rgba(255,255,255,.15);
  }
  .checkin-btn:not(:disabled):hover{
    transform:translateY(-2px);
    box-shadow:0 8px 32px rgba(34,197,94,.35),inset 0 1px 0 rgba(255,255,255,.2);
  }
  .checkin-btn:not(:disabled):active{transform:scale(.97)}
  .checkin-btn:disabled{
    background:rgba(255,255,255,.05); color:var(--dim);
    cursor:not-allowed; box-shadow:none;
    border:1px solid var(--border);
  }
  .checkin-btn .icon{display:inline-block;margin-right:8px;transition:transform .4s}
  .checkin-btn:not(:disabled):hover .icon{transform:scale(1.15) rotate(-8deg)}
  .ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,.3);
    transform:scale(0); animation:ripple .6s; pointer-events:none;
  }
  @keyframes ripple{to{transform:scale(4); opacity:0}}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:12px 6px;
    text-align:center; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transition:all .25s; position:relative; overflow:hidden;
  }
  .stat:hover{border-color:var(--border2); transform:translateY(-1px)}
  .stat-icon{font-size:.9rem; margin-bottom:2px; opacity:.7}
  .stat-num{
    font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-0.03em;
    background:linear-gradient(135deg,var(--green3),var(--gold));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  .stat-label{font-size:.62rem;color:var(--dim);margin-top:1px;text-transform:uppercase;letter-spacing:.06em}

  .heatmap-card{
    background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  }
  .heatmap-title{
    font-size:.73rem;color:var(--dim);margin-bottom:10px;
    display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em;
  }
  .heatmap-title span:last-child{color:var(--green3);font-weight:600;font-variant-numeric:tabular-nums}
  .heatmap-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .heat-cell{
    aspect-ratio:1;border-radius:5px;background:rgba(255,255,255,.03);
    transition:all .2s; position:relative;
  }
  .heat-cell.checked{
    background:linear-gradient(135deg,var(--green),var(--green2));
    box-shadow:0 0 8px rgba(34,197,94,.25);
  }
  .heat-cell.today{
    border:1.5px solid var(--gold); box-shadow:0 0 10px rgba(251,191,36,.35);
  }
  .heat-cell:not(.checked):hover{background:rgba(255,255,255,.07)}

  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(120px);
    background:linear-gradient(135deg,rgba(34,197,94,.15),rgba(251,191,36,.1));
    border:1px solid rgba(74,222,128,.25); color:var(--green3);
    padding:12px 24px; border-radius:16px; font-size:.85rem; font-weight:600;
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    transition:transform .5s cubic-bezier(.34,1.56,.64,1); z-index:100;
    box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 30px rgba(34,197,94,.1);
    display:flex; align-items:center; gap:8px;
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particle{position:absolute;border-radius:50%;opacity:0}

  .footer{text-align:center;margin-top:14px;font-size:.68rem;color:var(--dim2);letter-spacing:.03em}
</style>
</head>
<body>
<div class="ambient" id="ambient"></div>
<div class="app">
  <div class="header">
    <h1>🌱 种树打卡</h1>
    <p>坚持打卡，见证成长</p>
  </div>

  <div class="tree-card">
    <div class="particles" id="particles"></div>
    <div class="tree-stage-bar" id="stage-bar"></div>
    <div class="tree-wrap">
      <svg class="tree-svg" id="tree-svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet">
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="50%">
            <stop offset="0%" stop-color="#FBBF24" stop-opacity=".25"/>
            <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#3E2723"/>
            <stop offset="50%" stop-color="#5D4037"/>
            <stop offset="100%" stop-color="#3E2723"/>
          </linearGradient>
          <radialGradient id="leafGrad1" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#4ADE80"/>
            <stop offset="70%" stop-color="#22C55E"/>
            <stop offset="100%" stop-color="#15803D"/>
          </radialGradient>
          <radialGradient id="leafGrad2" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#86EFAC"/>
            <stop offset="70%" stop-color="#4ADE80"/>
            <stop offset="100%" stop-color="#16A34A"/>
          </radialGradient>
          <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
            <feOffset dx="0" dy="4" result="offsetblur"/>
            <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
      </svg>
    </div>
    <div class="stage-info">
      <div class="stage-badge"><span class="stage-dot"></span><span id="badge-text">等待发芽</span></div>
      <div class="stage-name" id="stage-name">种子</div>
      <div class="stage-hint" id="stage-hint">打卡 1 天开始发芽</div>
      <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div></div>
    </div>
    <button class="checkin-btn" id="checkin-btn" onclick="checkin(event)">
      <span class="icon">🌱</span><span id="btn-text">今日打卡</span>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-icon">📅</div><div class="stat-num" id="total-days">0</div><div class="stat-label">总天数</div></div>
    <div class="stat"><div class="stat-icon">🔥</div><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续</div></div>
    <div class="stat"><div class="stat-icon">🌳</div><div class="stat-num" id="stage-num">1/8</div><div class="stat-label">阶段</div></div>
  </div>

  <div class="heatmap-card">
    <div class="heatmap-title"><span>最近 14 天</span><span id="heatmap-count">0 / 14</span></div>
    <div class="heatmap-grid" id="heatmap-grid"></div>
  </div>

  <div class="footer">数据保存在本地浏览器 · 每日打卡一次</div>
</div>

<div class="toast" id="toast"><span>🌱</span><span id="toast-text">打卡成功！</span></div>

<script>
const STAGES = [
  {name:'种子',    min:0,   hint:'打卡 1 天开始发芽',       badge:'等待发芽'},
  {name:'发芽',    min:1,   hint:'坚持 3 天长出幼苗',       badge:'破土而出'},
  {name:'幼苗',    min:3,   hint:'坚持 7 天长成小树',       badge:'茁壮成长'},
  {name:'小树',    min:7,   hint:'坚持 15 天枝繁叶茂',      badge:'枝干挺拔'},
  {name:'中树',    min:15,  hint:'坚持 30 天开出花朵',      badge:'枝繁叶茂'},
  {name:'开花',    min:30,  hint:'坚持 60 天结出果实',      badge:'繁花似锦'},
  {name:'结果',    min:60,  hint:'坚持 100 天成为参天大树', badge:'硕果累累'},
  {name:'参天大树', min:100, hint:'已是参天大树，了不起！',  badge:'参天大树'},
];

function getStage(days){let s=0;for(let i=0;i<STAGES.length;i++)if(days>=STAGES[i].min)s=i;return s}
function todayStr(){return new Date().toISOString().slice(0,10)}
function dateStr(d){return d.toISOString().slice(0,10)}
function loadData(){try{return JSON.parse(localStorage.getItem('tree-checkin')||'{"dates":[]}')}catch(e){return{dates:[]}}}
function saveData(d){localStorage.setItem('tree-checkin',JSON.stringify(d))}
function isTodayChecked(data){return data.dates.includes(todayStr())}

function getStreak(dates){
  if(!dates.length)return 0;
  const sorted=[...dates].sort();
  let streak=1;
  for(let i=sorted.length-1;i>0;i--){
    const d1=new Date(sorted[i]),d2=new Date(sorted[i-1]);
    if(Math.round((d1-d2)/86400000)===1)streak++;else break;
  }
  const last=new Date(sorted[sorted.length-1]),today=new Date(todayStr());
  if(Math.round((today-last)/86400000)>1)return 0;
  return streak;
}

function renderTree(stage){
  const svg=document.getElementById('tree-svg');
  const cx=200,groundY=345;
  let html='';

  // 地面阴影
  html+=`<ellipse cx="${cx}" cy="${groundY+12}" rx="130" ry="16" fill="rgba(40,30,20,.3)"/>`;
  html+=`<ellipse cx="${cx}" cy="${groundY}" rx="105" ry="12" fill="rgba(60,42,28,.4)"/>`;
  // 草地
  for(let i=0;i<12;i++){
    const gx=cx-90+i*16+(Math.random()-0.5)*8;
    const gh=4+Math.random()*4;
    html+=`<path d="M ${gx} ${groundY} Q ${gx+1} ${groundY-gh} ${gx+2} ${groundY}" stroke="#2D5A27" stroke-width="1.5" fill="none" opacity=".5" stroke-linecap="round"/>`;
  }

  if(stage===0){
    html+=`<g class="foliage"><ellipse cx="${cx}" cy="${groundY-5}" rx="9" ry="6" fill="#7B5E3A"/>
    <ellipse cx="${cx-2}" cy="${groundY-6}" rx="4" ry="2.5" fill="#9C7A4A" opacity=".6"/>
    <path d="M ${cx-3} ${groundY-8} Q ${cx} ${groundY-12} ${cx+3} ${groundY-8}" stroke="#4ADE80" stroke-width="1" fill="none" opacity=".3"/></g>`;
  } else if(stage===1){
    html+=`<g class="foliage sway">
    <path d="M ${cx-2} ${groundY} Q ${cx-1} ${groundY-8} ${cx} ${groundY-16} Q ${cx+1} ${groundY-8} ${cx+2} ${groundY}" fill="#22C55E"/>
    <ellipse cx="${cx-5}" cy="${groundY-14}" rx="6" ry="3" fill="url(#leafGrad2)" transform="rotate(-30 ${cx-5} ${groundY-14})"/>
    <ellipse cx="${cx+5}" cy="${groundY-12}" rx="5" ry="2.5" fill="url(#leafGrad1)" transform="rotate(25 ${cx+5} ${groundY-12})"/>
    </g>`;
  } else if(stage===2){
    const h=36;
    html+=`<g class="foliage sway"><path d="M ${cx-2.5} ${groundY} Q ${cx-1} ${groundY-h/2} ${cx} ${groundY-h} Q ${cx+1} ${groundY-h/2} ${cx+2.5} ${groundY}" fill="url(#trunkGrad)"/>`;
    for(let i=0;i<4;i++){
      const ly=groundY-10-i*7,side=i%2?1:-1,len=8+i*2;
      html+=`<ellipse cx="${cx+side*len}" cy="${ly}" rx="${6+i}" ry="${3+i*0.5}" fill="url(#leafGrad${i%2+1})" transform="rotate(${side*35} ${cx+side*len} ${ly})"/>`;
    }
    html+=`</g>`;
  } else {
    const trunkH=stage===3?52:stage===4?72:stage===5?88:stage===6?98:112;
    const trunkW=stage===3?9:stage===4?13:stage===5?17:stage===6?19:24;
    const crownR=stage===3?38:stage===4?58:stage===5?78:stage===6?88:105;
    const crownY=groundY-trunkH-crownR*0.25;

    // 树干
    html+=`<g filter="url(#softShadow)"><path d="M ${cx-trunkW/2} ${groundY} Q ${cx-trunkW/2-4} ${groundY-trunkH*0.5} ${cx-trunkW/2+1} ${groundY-trunkH} L ${cx+trunkW/2-1} ${groundY-trunkH} Q ${cx+trunkW/2+4} ${groundY-trunkH*0.5} ${cx+trunkW/2} ${groundY} Z" fill="url(#trunkGrad)"/>`;
    // 树干纹理
    for(let i=0;i<3;i++){
      const tx=cx-trunkW/4+i*trunkW/4;
      html+=`<path d="M ${tx} ${groundY-trunkH+8} Q ${tx+(Math.random()-0.5)*3} ${groundY-trunkH/2} ${tx+(Math.random()-0.5)*2} ${groundY-5}" stroke="#2E1A14" stroke-width="1" fill="none" opacity=".4"/>`;
    }
    // 树根
    html+=`<path d="M ${cx-trunkW/2} ${groundY} Q ${cx-trunkW-8} ${groundY+3} ${cx-trunkW-14} ${groundY-1}" stroke="#3E2723" stroke-width="${trunkW*0.3}" fill="none" stroke-linecap="round" opacity=".6"/>`;
    html+=`<path d="M ${cx+trunkW/2} ${groundY} Q ${cx+trunkW+8} ${groundY+3} ${cx+trunkW+14} ${groundY-1}" stroke="#3E2723" stroke-width="${trunkW*0.3}" fill="none" stroke-linecap="round" opacity=".6"/>`;
    html+=`</g>`;

    // 树冠
    const layers=stage>=5?6:stage>=3?5:4;
    html+=`<g class="foliage sway" filter="url(#softShadow)">`;
    const positions=[];
    for(let i=0;i<layers;i++){
      const angle=(i/layers)*Math.PI*2+0.3;
      const r=crownR*0.45;
      const ox=Math.cos(angle)*r;
      const oy=Math.sin(angle)*r*0.5-crownR*0.08;
      const layerR=crownR*(0.5+(i%3)*0.08);
      positions.push({x:cx+ox,y:crownY+oy,r:layerR,grad:i%2+1});
    }
    positions.forEach(p=>{
      html+=`<circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="url(#leafGrad${p.grad})" opacity=".88"/>`;
    });
    html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*0.65}" fill="url(#leafGrad1)" opacity=".9"/>`;
    // 高光叶子
    for(let i=0;i<5;i++){
      const a=Math.random()*Math.PI*2,d=crownR*0.4*Math.random();
      html+=`<ellipse cx="${cx+Math.cos(a)*d}" cy="${crownY+Math.sin(a)*d-5}" rx="4" ry="2" fill="#86EFAC" opacity=".4" transform="rotate(${Math.random()*360} ${cx+Math.cos(a)*d} ${crownY+Math.sin(a)*d-5})"/>`;
    }
    html+=`</g>`;

    // 开花
    if(stage>=5){
      html+=`<g class="foliage">`;
      const fc=stage===5?8:stage===6?5:12;
      for(let i=0;i<fc;i++){
        const a=Math.random()*Math.PI*2,d=crownR*0.55*Math.random();
        const fx=cx+Math.cos(a)*d,fy=crownY+Math.sin(a)*d*0.7;
        html+=`<g><circle cx="${fx}" cy="${fy}" r="5" fill="#F472B6" opacity=".85"/>`;
        html+=`<circle cx="${fx}" cy="${fy}" r="2" fill="#FBBF24"/>`;
        html+=`<circle cx="${fx-1}" cy="${fy-1}" r="1.5" fill="#FCE7F3" opacity=".6"/></g>`;
      }
      html+=`</g>`;
    }

    // 结果
    if(stage>=6){
      html+=`<g class="foliage">`;
      const fc=stage===6?6:10;
      for(let i=0;i<fc;i++){
        const a=Math.random()*Math.PI*2,d=crownR*0.6*Math.random();
        const fx=cx+Math.cos(a)*d,fy=crownY+Math.sin(a)*d*0.7;
        html+=`<g><circle cx="${fx}" cy="${fy}" r="5.5" fill="#EF4444" opacity=".95"/>`;
        html+=`<circle cx="${fx-1.5}" cy="${fy-1.5}" r="2" fill="#FCA5A5" opacity=".7"/>`;
        html+=`<ellipse cx="${fx}" cy="${fy-5}" rx="2" ry="1" fill="#22C55E" opacity=".7" transform="rotate(30 ${fx} ${fy-5})"/></g>`;
      }
      html+=`</g>`;
    }

    // 参天大树光晕
    if(stage>=7){
      html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*1.15}" fill="none" stroke="#FBBF24" stroke-width="2" opacity=".25"/>`;
      html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*1.3}" fill="none" stroke="#FBBF24" stroke-width="1" opacity=".12"/>`;
      // 飘落叶子
      for(let i=0;i<3;i++){
        const lx=cx+(Math.random()-0.5)*crownR*1.5,ly=crownY+Math.random()*crownR;
        html+=`<ellipse cx="${lx}" cy="${ly}" rx="3" ry="1.5" fill="#FBBF24" opacity=".4" transform="rotate(${Math.random()*360} ${lx} ${ly})"/>`;
      }
    }
  }

  // 阳光
  html+=`<circle cx="345" cy="55" r="40" fill="url(#sunGlow)"/>`;
  html+=`<circle cx="345" cy="55" r="14" fill="#FBBF24" opacity=".12"/>`;
  html+=`<circle cx="345" cy="55" r="7" fill="#FDE687" opacity=".2"/>`;

  // 保留 defs
  const defs=svg.querySelector('defs').outerHTML;
  svg.innerHTML=defs+html;
}

function renderStageBar(stage){
  const bar=document.getElementById('stage-bar');
  let html='';
  for(let i=0;i<STAGES.length;i++){
    const cls=i<stage?'active':i===stage?'current':'';
    html+=`<div class="stage-pip ${cls}"></div>`;
  }
  bar.innerHTML=html;
}

function updateUI(){
  const data=loadData();
  const total=data.dates.length;
  const streak=getStreak(data.dates);
  const stage=getStage(total);
  const checked=isTodayChecked(data);

  document.getElementById('total-days').textContent=total;
  document.getElementById('streak-days').textContent=streak;
  document.getElementById('stage-num').textContent=`${stage+1}/${STAGES.length}`;
  document.getElementById('stage-name').textContent=STAGES[stage].name;
  document.getElementById('stage-hint').textContent=STAGES[stage].hint;
  document.getElementById('badge-text').textContent=STAGES[stage].badge;

  let progress=100;
  if(stage<STAGES.length-1){
    const cur=STAGES[stage].min,next=STAGES[stage+1].min;
    progress=((total-cur)/(next-cur))*100;
  }
  document.getElementById('progress-fill').style.width=Math.min(100,progress)+'%';

  const btn=document.getElementById('checkin-btn');
  const btnText=document.getElementById('btn-text');
  if(checked){btn.disabled=true;btnText.textContent='今日已打卡 ✓'}
  else{btn.disabled=false;btnText.textContent='今日打卡'}

  renderStageBar(stage);
  renderTree(stage);
  renderHeatmap(data.dates);
}

function renderHeatmap(dates){
  const grid=document.getElementById('heatmap-grid');
  const days=14;
  let html='';
  const today=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=dateStr(d);
    const checked=dates.includes(ds);
    const isToday=ds===todayStr();
    html+=`<div class="heat-cell${checked?' checked':''}${isToday?' today':''}" title="${ds}${checked?' ✓':''}"></div>`;
  }
  grid.innerHTML=html;
  const recent=dates.filter(d=>{
    const diff=Math.round((new Date(todayStr())-new Date(d))/86400000);
    return diff>=0&&diff<days;
  }).length;
  document.getElementById('heatmap-count').textContent=`${recent} / ${days}`;
}

function checkin(e){
  const data=loadData();
  const today=todayStr();
  if(isTodayChecked(data))return;

  // 涟漪
  if(e){
    const btn=e.currentTarget;
    const rect=btn.getBoundingClientRect();
    const ripple=document.createElement('span');
    ripple.className='ripple';
    const size=Math.max(rect.width,rect.height);
    ripple.style.width=ripple.style.height=size+'px';
    ripple.style.left=(e.clientX-rect.left-size/2)+'px';
    ripple.style.top=(e.clientY-rect.top-size/2)+'px';
    btn.appendChild(ripple);
    setTimeout(()=>ripple.remove(),600);
  }

  data.dates.push(today);
  data.dates=[...new Set(data.dates)].sort();
  saveData(data);

  showToast();
  spawnParticles();
  updateUI();
}

function showToast(){
  const toast=document.getElementById('toast');
  const toastText=document.getElementById('toast-text');
  const data=loadData();
  const total=data.dates.length;
  const oldStage=getStage(total-1),newStage=getStage(total);
  if(newStage>oldStage){
    toastText.textContent=`树进化为「${STAGES[newStage].name}」！`;
    toast.querySelector('span').textContent='🎉';
  } else {
    toastText.textContent='树又长大了一点！';
    toast.querySelector('span').textContent='🌱';
  }
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}

function spawnParticles(){
  const container=document.getElementById('particles');
  const colors=['#22C55E','#4ADE80','#86EFAC','#FBBF24','#F472B6'];
  for(let i=0;i<24;i++){
    const p=document.createElement('div');
    p.className='particle';
    const size=4+Math.random()*5;
    p.style.width=p.style.height=size+'px';
    p.style.left='50%';
    p.style.top='45%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.boxShadow=`0 0 ${size}px ${colors[Math.floor(Math.random()*colors.length)]}`;
    container.appendChild(p);
    const angle=Math.random()*Math.PI*2;
    const dist=60+Math.random()*100;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist-40;
    p.animate([
      {opacity:1,transform:'translate(-50%,-50%) scale(1)'},
      {opacity:0,transform:`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(0)`}
    ],{duration:900+Math.random()*600,easing:'cubic-bezier(.4,0,.2,1)'});
    setTimeout(()=>p.remove(),1500);
  }
}

function initAmbient(){
  const container=document.getElementById('ambient');
  for(let i=0;i<15;i++){
    const s=document.createElement('div');
    s.className='spore';
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(8+Math.random()*12)+'s';
    s.style.animationDelay=Math.random()*10+'s';
    s.style.width=s.style.height=(2+Math.random()*3)+'px';
    container.appendChild(s);
  }
}

initAmbient();
updateUI();
</script>
</body>
</html>
