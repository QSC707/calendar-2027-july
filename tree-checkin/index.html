<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>种树打卡 · Tree Check-in</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#080808; --card:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.08);
    --text:#f0f0f0; --dim:#888; --accent:#6366F1; --accent2:#A855F7;
    --green:#22C55E; --green2:#16A34A; --gold:#FBBF24; --pink:#EC4899;
  }
  body{
    background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow-x:hidden; letter-spacing:-0.01em;
  }
  body::before,body::after{
    content:''; position:fixed; border-radius:50%; filter:blur(100px); pointer-events:none; z-index:0;
  }
  body::before{width:500px;height:500px;background:rgba(99,102,241,.08);top:-150px;left:-150px}
  body::after{width:500px;height:500px;background:rgba(168,85,247,.06);bottom:-150px;right:-150px}

  .app{position:relative;z-index:1;width:100%;max-width:480px;padding:24px 20px}

  .header{text-align:center;margin-bottom:20px}
  .header h1{font-size:1.5rem;font-weight:700;letter-spacing:-0.03em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .header p{font-size:.8rem;color:var(--dim);margin-top:4px}

  .tree-card{
    background:var(--card); border:1px solid var(--border); border-radius:24px;
    padding:20px; backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    box-shadow:0 0 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);
    margin-bottom:16px; position:relative; overflow:hidden;
  }
  .tree-card::before{
    content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
    background:linear-gradient(105deg,transparent,rgba(255,255,255,.03),transparent);
    animation:shimmer 7s infinite;
  }
  @keyframes shimmer{0%{left:-100%}100%{left:200%}}

  .tree-svg{width:100%; height:280px; display:block}

  .stage-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:20px; font-size:.75rem; font-weight:600;
    background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(168,85,247,.15));
    border:1px solid rgba(99,102,241,.25); color:var(--accent);
    margin-bottom:12px;
  }
  .stage-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 3s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}

  .stage-info{text-align:center; margin-bottom:16px}
  .stage-name{font-size:1.1rem;font-weight:700;margin-bottom:2px}
  .stage-hint{font-size:.75rem;color:var(--dim)}

  .progress-bar{height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden;margin-top:10px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--green2));border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(34,197,94,.4)}

  .checkin-btn{
    width:100%; padding:16px; border:none; border-radius:16px; cursor:pointer;
    font-size:1rem; font-weight:700; letter-spacing:-0.01em;
    background:linear-gradient(135deg,var(--green),var(--green2));
    color:#fff; transition:all .2s; position:relative; overflow:hidden;
    box-shadow:0 4px 20px rgba(34,197,94,.3);
  }
  .checkin-btn:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(34,197,94,.4)}
  .checkin-btn:active{transform:scale(.97)}
  .checkin-btn:disabled{background:rgba(255,255,255,.06);color:var(--dim);cursor:not-allowed;box-shadow:none;transform:none}
  .checkin-btn .icon{display:inline-block;margin-right:8px;transition:transform .3s}
  .checkin-btn:not(:disabled):hover .icon{transform:scale(1.2) rotate(-10deg)}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 8px;
    text-align:center; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  .stat-num{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .stat-label{font-size:.65rem;color:var(--dim);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

  .heatmap{margin-top:16px}
  .heatmap-title{font-size:.75rem;color:var(--dim);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .heatmap-grid{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
  .heat-cell{aspect-ratio:1;border-radius:4px;background:rgba(255,255,255,.04);transition:all .2s}
  .heat-cell.checked{background:var(--green);box-shadow:0 0 6px rgba(34,197,94,.3)}
  .heat-cell.today{border:1.5px solid var(--accent);box-shadow:0 0 8px rgba(99,102,241,.4)}
  .heat-cell:not(.checked):hover{background:rgba(255,255,255,.08)}

  .toast{
    position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px);
    background:rgba(34,197,94,.15); border:1px solid rgba(34,197,94,.3); color:var(--green);
    padding:12px 24px; border-radius:14px; font-size:.85rem; font-weight:600;
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    transition:transform .4s cubic-bezier(.4,0,.2,1); z-index:100;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
  }
  .toast.show{transform:translateX(-50%) translateY(0)}

  .particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .particle{position:absolute;width:6px;height:6px;border-radius:50%;opacity:0}

  @keyframes grow{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  .tree-svg g{animation:grow .8s cubic-bezier(.4,0,.2,1);transform-origin:center bottom}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🌱 种树打卡</h1>
    <p>坚持打卡，见证成长</p>
  </div>

  <div class="tree-card">
    <div class="particles" id="particles"></div>
    <div style="display:flex;justify-content:center;margin-bottom:8px">
      <div class="stage-badge"><span class="stage-dot"></span><span id="badge-text">成长中</span></div>
    </div>
    <svg class="tree-svg" id="tree-svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="stage-info">
      <div class="stage-name" id="stage-name">种子</div>
      <div class="stage-hint" id="stage-hint">打卡 1 天开始发芽</div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
    </div>
    <button class="checkin-btn" id="checkin-btn" onclick="checkin()">
      <span class="icon">🌱</span><span id="btn-text">今日打卡</span>
    </button>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="total-days">0</div><div class="stat-label">总天数</div></div>
    <div class="stat"><div class="stat-num" id="streak-days">0</div><div class="stat-label">连续天数</div></div>
    <div class="stat"><div class="stat-num" id="stage-num">1/8</div><div class="stat-label">成长阶段</div></div>
  </div>

  <div class="heatmap">
    <div class="heatmap-title"><span>最近打卡</span><span id="heatmap-count">0 天</span></div>
    <div class="heatmap-grid" id="heatmap-grid"></div>
  </div>
</div>

<div class="toast" id="toast">打卡成功！树又长大了一点 🎉</div>

<script>
const STAGES = [
  {name:'种子',    min:0,   hint:'打卡 1 天开始发芽',          badge:'等待发芽'},
  {name:'发芽',    min:1,   hint:'坚持 3 天长出幼苗',          badge:'破土而出'},
  {name:'幼苗',    min:3,   hint:'坚持 7 天长成小树',          badge:'茁壮成长'},
  {name:'小树',    min:7,   hint:'坚持 15 天枝繁叶茂',         badge:'枝干挺拔'},
  {name:'中树',    min:15,  hint:'坚持 30 天开出花朵',         badge:'枝繁叶茂'},
  {name:'开花',    min:30,  hint:'坚持 60 天结出果实',         badge:'繁花似锦'},
  {name:'结果',    min:60,  hint:'坚持 100 天成为参天大树',    badge:'硕果累累'},
  {name:'参天大树', min:100, hint:'已是参天大树，了不起！',     badge:'参天大树'},
];

function getStage(days){
  let s = 0;
  for(let i=0;i<STAGES.length;i++) if(days>=STAGES[i].min) s=i;
  return s;
}

function todayStr(){return new Date().toISOString().slice(0,10)}
function dateStr(d){return d.toISOString().slice(0,10)}

function loadData(){
  try{return JSON.parse(localStorage.getItem('tree-checkin')||'{"dates":[]}')}
  catch(e){return{dates:[]}}
}
function saveData(d){localStorage.setItem('tree-checkin',JSON.stringify(d))}

function isTodayChecked(data){return data.dates.includes(todayStr())}

function getStreak(dates){
  if(!dates.length) return 0;
  const sorted=[...dates].sort();
  let streak=1;
  for(let i=sorted.length-1;i>0;i--){
    const d1=new Date(sorted[i]), d2=new Date(sorted[i-1]);
    const diff=Math.round((d1-d2)/86400000);
    if(diff===1) streak++; else break;
  }
  const last=new Date(sorted[sorted.length-1]);
  const today=new Date(todayStr());
  const diff=Math.round((today-last)/86400000);
  if(diff>1) return 0;
  return streak;
}

function renderTree(stage){
  const svg=document.getElementById('tree-svg');
  const cx=200, groundY=340;
  let html='';

  // 地面
  html+=`<ellipse cx="${cx}" cy="${groundY+8}" rx="120" ry="14" fill="rgba(60,40,30,.4)"/>`;
  html+=`<ellipse cx="${cx}" cy="${groundY}" rx="100" ry="10" fill="rgba(80,55,40,.5)"/>`;

  if(stage===0){
    // 种子
    html+=`<g><ellipse cx="${cx}" cy="${groundY-4}" rx="8" ry="5" fill="#8B6914"/>
    <ellipse cx="${cx-2}" cy="${groundY-5}" rx="3" ry="2" fill="#A07820" opacity=".6"/></g>`;
  } else if(stage===1){
    // 发芽
    html+=`<g><rect x="${cx-2}" y="${groundY-14}" width="4" height="14" rx="2" fill="#22C55E"/>
    <ellipse cx="${cx}" cy="${groundY-16}" rx="6" ry="3" fill="#4ADE80" transform="rotate(-20 ${cx} ${groundY-16})"/></g>`;
  } else if(stage===2){
    // 幼苗
    const h=30;
    html+=`<g><rect x="${cx-2}" y="${groundY-h}" width="4" height="${h}" rx="2" fill="#16A34A"/>`;
    for(let i=0;i<3;i++){
      const ly=groundY-12-i*8, side=i%2?1:-1;
      html+=`<ellipse cx="${cx+side*8}" cy="${ly}" rx="7" ry="3.5" fill="#22C55E" transform="rotate(${side*30} ${cx+side*8} ${ly})"/>`;
    }
    html+=`</g>`;
  } else {
    // 树干 + 树冠
    const trunkH = stage===3?50:stage===4?70:stage===5?85:stage===6?95:110;
    const trunkW = stage===3?8:stage===4?12:stage===5?16:stage===6?18:22;
    const crownR = stage===3?35:stage===4?55:stage===5?75:stage===6?85:100;
    const crownY = groundY-trunkH-crownR*0.3;

    // 树干
    html+=`<g><path d="M ${cx-trunkW/2} ${groundY} Q ${cx-trunkW/2-3} ${groundY-trunkH/2} ${cx-trunkW/2} ${groundY-trunkH} L ${cx+trunkW/2} ${groundY-trunkH} Q ${cx+trunkW/2+3} ${groundY-trunkH/2} ${cx+trunkW/2} ${groundY} Z" fill="#5D4037"/>`;
    // 树干纹理
    html+=`<line x1="${cx-2}" y1="${groundY-trunkH+10}" x2="${cx-3}" y2="${groundY-5}" stroke="#4A3128" stroke-width="1.5" opacity=".5"/>`;
    html+=`<line x1="${cx+3}" y1="${groundY-trunkH+15}" x2="${cx+4}" y2="${groundY-8}" stroke="#4A3128" stroke-width="1.5" opacity=".5"/></g>`;

    // 树冠 - 多层圆形
    const layers = stage>=5?5:stage>=3?4:3;
    html+=`<g>`;
    for(let i=0;i<layers;i++){
      const angle=(i/layers)*Math.PI*2;
      const r=crownR*0.55;
      const ox=Math.cos(angle)*r*0.5;
      const oy=Math.sin(angle)*r*0.3-crownR*0.1;
      const layerR=crownR*(0.55+Math.random()*0.15);
      const greens=['#16A34A','#22C55E','#15803D','#4ADE80','#166534'];
      html+=`<circle cx="${cx+ox}" cy="${crownY+oy}" r="${layerR}" fill="${greens[i%greens.length]}" opacity=".9"/>`;
    }
    html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*0.7}" fill="#22C55E" opacity=".85"/>`;
    html+=`</g>`;

    // 开花
    if(stage>=5){
      html+=`<g>`;
      const flowerCount=stage===5?6:stage===6?4:10;
      for(let i=0;i<flowerCount;i++){
        const angle=Math.random()*Math.PI*2;
        const dist=crownR*0.5*Math.random();
        const fx=cx+Math.cos(angle)*dist;
        const fy=crownY+Math.sin(angle)*dist*0.7;
        html+=`<circle cx="${fx}" cy="${fy}" r="4" fill="#EC4899" opacity=".9"/>`;
        html+=`<circle cx="${fx}" cy="${fy}" r="1.5" fill="#FBBF24"/>`;
      }
      html+=`</g>`;
    }

    // 结果
    if(stage>=6){
      html+=`<g>`;
      const fruitCount=stage===6?5:8;
      for(let i=0;i<fruitCount;i++){
        const angle=Math.random()*Math.PI*2;
        const dist=crownR*0.6*Math.random();
        const fx=cx+Math.cos(angle)*dist;
        const fy=crownY+Math.sin(angle)*dist*0.7;
        html+=`<circle cx="${fx}" cy="${fy}" r="5" fill="#EF4444" opacity=".95"/>`;
        html+=`<circle cx="${fx-1.5}" cy="${fy-1.5}" r="1.5" fill="#FCA5A5" opacity=".7"/>`;
      }
      html+=`</g>`;
    }

    // 参天大树光晕
    if(stage>=7){
      html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*1.2}" fill="none" stroke="#FBBF24" stroke-width="2" opacity=".3"/>`;
      html+=`<circle cx="${cx}" cy="${crownY}" r="${crownR*1.35}" fill="none" stroke="#FBBF24" stroke-width="1" opacity=".15"/>`;
    }
  }

  // 阳光
  html+=`<circle cx="340" cy="60" r="25" fill="#FBBF24" opacity=".08"/>`;
  html+=`<circle cx="340" cy="60" r="15" fill="#FBBF24" opacity=".06"/>`;

  svg.innerHTML=html;
}

function updateUI(){
  const data=loadData();
  const total=data.dates.length;
  const streak=getStreak(data.dates);
  const stage=getStage(total);
  const checked=isTodayChecked(data);

  document.getElementById('total-days').textContent=total;
  document.getElementById('streak-days').textContent=streak;
  document.getElementById('stage-num').textContent=`${stage+1}/${STAGES.length}`;

  document.getElementById('stage-name').textContent=STAGES[stage].name;
  document.getElementById('stage-hint').textContent=STAGES[stage].hint;
  document.getElementById('badge-text').textContent=STAGES[stage].badge;

  // 进度条
  let progress=100;
  if(stage<STAGES.length-1){
    const cur=STAGES[stage].min, next=STAGES[stage+1].min;
    progress=((total-cur)/(next-cur))*100;
  }
  document.getElementById('progress-fill').style.width=Math.min(100,progress)+'%';

  // 按钮
  const btn=document.getElementById('checkin-btn');
  const btnText=document.getElementById('btn-text');
  if(checked){
    btn.disabled=true;
    btnText.textContent='今日已打卡 ✓';
  } else {
    btn.disabled=false;
    btnText.textContent='今日打卡';
  }

  renderTree(stage);
  renderHeatmap(data.dates);
}

function renderHeatmap(dates){
  const grid=document.getElementById('heatmap-grid');
  const days=14;
  let html='';
  const today=new Date();
  for(let i=days-1;i>=0;i--){
    const d=new Date(today);
    d.setDate(d.getDate()-i);
    const ds=dateStr(d);
    const checked=dates.includes(ds);
    const isToday=ds===todayStr();
    html+=`<div class="heat-cell${checked?' checked':''}${isToday?' today':''}" title="${ds}${checked?' ✓':''}"></div>`;
  }
  grid.innerHTML=html;
  const recent=dates.filter(d=>{
    const diff=Math.round((new Date(todayStr())-new Date(d))/86400000);
    return diff>=0&&diff<days;
  }).length;
  document.getElementById('heatmap-count').textContent=`${recent} / ${days} 天`;
}

function checkin(){
  const data=loadData();
  const today=todayStr();
  if(isTodayChecked(data)) return;

  data.dates.push(today);
  data.dates=[...new Set(data.dates)].sort();
  saveData(data);

  showToast();
  spawnParticles();
  updateUI();
}

function showToast(){
  const toast=document.getElementById('toast');
  const data=loadData();
  const total=data.dates.length;
  const oldStage=getStage(total-1);
  const newStage=getStage(total);
  if(newStage>oldStage){
    toast.textContent=`打卡成功！树进化为「${STAGES[newStage].name}」🎉`;
  } else {
    toast.textContent='打卡成功！树又长大了一点 🌱';
  }
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'),3000);
}

function spawnParticles(){
  const container=document.getElementById('particles');
  const colors=['#22C55E','#4ADE80','#86EFAC','#FBBF24','#EC4899'];
  for(let i=0;i<20;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=(50+Math.random()*0)+'%';
    p.style.top='50%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    container.appendChild(p);
    const angle=Math.random()*Math.PI*2;
    const dist=80+Math.random()*80;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist-50;
    p.animate([
      {opacity:1,transform:'translate(0,0) scale(1)'},
      {opacity:0,transform:`translate(${dx}px,${dy}px) scale(0)`}
    ],{duration:1000+Math.random()*500,easing:'cubic-bezier(.4,0,.2,1)'});
    setTimeout(()=>p.remove(),1500);
  }
}

updateUI();
</script>
</body>
</html>
