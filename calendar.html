<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027年7月 · 日历</title>
<style>
  :root {
    --bg: #080808;
    --border: rgba(255, 255, 255, 0.08);
    --border-hover: rgba(255, 255, 255, 0.16);
    --text: #EDEDEF;
    --text-secondary: #8A8F98;
    --text-muted: #56565F;
    --indigo: #6366F1;
    --purple: #A855F7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "SF Pro Display", "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    letter-spacing: -0.02em;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    top: -20%;
    left: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(99, 102, 241, 0.16) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 60%;
    height: 60%;
    background: radial-gradient(circle, rgba(168, 85, 247, 0.13) 0%, transparent 70%);
    pointer-events: none;
  }

  .calendar {
    position: relative;
    width: 440px;
    background: rgba(10, 10, 12, 0.6);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px 36px 30px;
    box-shadow:
      0 1px 0 rgba(255, 255, 255, 0.05) inset,
      0 30px 80px rgba(0, 0, 0, 0.6);
    overflow: hidden;
  }

  .calendar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, 0.04) 50%, transparent 70%);
    background-size: 200% 200%;
    animation: shimmer 7s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 200% 200%; }
    50% { background-position: 0% 0%; }
  }

  .header { margin-bottom: 28px; position: relative; }
  .year-label {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .title {
    font-size: 34px;
    font-weight: 600;
    letter-spacing: -0.03em;
  }
  .title-en {
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.18em;
  }

  .weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .weekday {
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
  }
  .weekday.we { color: var(--indigo); opacity: 0.75; }

  .days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    position: relative;
  }
  .day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
  }
  .day.empty { cursor: default; pointer-events: none; }
  .day.we { color: #B4B8C0; }
  .day:hover:not(.empty) {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--border-hover);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 0 18px rgba(99, 102, 241, 0.1);
  }
  .day:active:not(.empty) {
    transform: scale(0.95);
  }
  .day.selected {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
    border-color: rgba(99, 102, 241, 0.55);
    color: #fff;
    font-weight: 600;
    box-shadow: 0 0 24px rgba(99, 102, 241, 0.35), 0 0 48px rgba(168, 85, 247, 0.18), 0 1px 0 rgba(255, 255, 255, 0.1) inset;
  }

  .footer {
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .selected-info { font-size: 13px; color: var(--text-secondary); }
  .selected-info strong { color: var(--text); font-weight: 500; }
  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--indigo), var(--purple));
    box-shadow: 0 0 12px rgba(99, 102, 241, 0.6);
    animation: breathe 3s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.15); }
  }
</style>
</head>
<body>
  <div class="calendar">
    <div class="header">
      <div class="year-label">2027</div>
      <div class="title-row">
        <div class="title">七月</div>
        <div class="title-en">JULY</div>
      </div>
    </div>
    <div class="weekdays">
      <div class="weekday we">日</div>
      <div class="weekday">一</div>
      <div class="weekday">二</div>
      <div class="weekday">三</div>
      <div class="weekday">四</div>
      <div class="weekday">五</div>
      <div class="weekday we">六</div>
    </div>
    <div class="days" id="days"></div>
    <div class="footer">
      <div class="selected-info" id="info"><strong>7月1日</strong> · 星期四</div>
      <div class="dot"></div>
    </div>
  </div>
<script>
  const daysEl = document.getElementById('days');
  const infoEl = document.getElementById('info');
  const weekdayNames = ['日', '一', '二', '三', '四', '五', '六'];
  const startWeekday = 4;
  const totalDays = 31;
  let selected = 1;

  function render() {
    daysEl.innerHTML = '';
    for (let i = 0; i < startWeekday; i++) {
      const el = document.createElement('div');
      el.className = 'day empty';
      daysEl.appendChild(el);
    }
    for (let d = 1; d <= totalDays; d++) {
      const el = document.createElement('div');
      el.className = 'day';
      const wd = (startWeekday + d - 1) % 7;
      if (wd === 0 || wd === 6) el.classList.add('we');
      if (d === selected) el.classList.add('selected');
      el.textContent = d;
      el.addEventListener('click', () => {
        selected = d;
        render();
        infoEl.innerHTML = '<strong>7月' + d + '日</strong> · 星期' + weekdayNames[wd];
      });
      daysEl.appendChild(el);
    }
  }
  render();
</script>
</body>
</html>
